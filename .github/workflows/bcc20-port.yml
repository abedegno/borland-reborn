# The bcc20 port: build the native compiler and its library on Linux, macOS and Windows,
# check them against BCC.EXE's golden outputs (bcc20-port/tests/golden, made locally by
# tools/golden.py make), and on a tag bcc20-vX.Y.Z publish them as a GitHub release.
# Nothing here needs BCC.EXE or the Borland toolchain.
name: bcc20-port
on:
  push:
    branches: [main]
    tags: ["bcc20-v*"]
    paths: ["bcc20-port/**", "bcc20/src/include/**", ".github/workflows/bcc20-port.yml"]
  pull_request:
    paths: ["bcc20-port/**", "bcc20/src/include/**", ".github/workflows/bcc20-port.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64, shell: bash }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, shell: bash }
          - { os: macos-15, platform: macos-arm64, shell: bash }
          - { os: windows-2025, platform: windows-x86_64, shell: "msys2 {0}" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}     # the runner context is not available here
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Build
        run: make -C bcc20-port -j4 native lib shlib
      - name: Check against BCC.EXE's golden outputs
        run: python3 bcc20-port/tools/golden.py check
      - name: Package
        run: |
          name=bcc20-${{ matrix.platform }}
          mkdir -p dist/$name/include dist/$name/lib
          cd bcc20-port/build
          cp bcc bcc.exe bcc20run bcc20run.exe ../../dist/$name/ 2>/dev/null || true
          cp libbcc20.a libbcc20.so libbcc20.dylib libbcc20.dll ../../dist/$name/lib/ 2>/dev/null || true
          cd ../..
          # the build keeps debug information (-g); the packages do not
          strip dist/$name/bcc* || true
          strip -S dist/$name/lib/* || true
          cp bcc20-port/include/bcc20.h dist/$name/include/
          cp LICENSE NOTICE.md dist/$name/
          cp bcc20-port/docs/RELEASE-README.md dist/$name/README.md
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            (cd $name && zip -qr ../$name.zip .)
          else
            tar czf $name.tar.gz $name
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: bcc20-${{ matrix.platform }}
          path: dist/bcc20-${{ matrix.platform }}.*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/bcc20-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: "Borland C++ 2.0 native compiler ${{ github.ref_name }}"
          files: dist/*
          body: |
            `bcc` (Borland C++ 2.0's command-line compiler as a native program) and `libbcc20`
            (one compile in-process, memory to memory), for Linux, macOS and Windows. Each build
            was checked against BCC.EXE's own outputs before release.

            Borland's headers and libraries are not included: `bcc` needs Borland C++ 2.0's
            `INCLUDE` directory (see the README in each archive). The compiler contains data
            from Borland's BCC.EXE; read NOTICE.md.
